# Test every push and pull request. On main, also rebuild the install page from
# src/bookmarklet.js and publish it to GitHub Pages, so the button people drag is always the
# code they can read in this repository.
#
# One-time repository setting: Settings > Pages > Source: "GitHub Actions".
#
# Supply chain: the published bookmarklet runs inside people's logged-in Amazon sessions, so
# the job that builds and publishes it is kept as small as possible.
# - Actions are pinned to full commit SHAs (the tag each SHA was taken from is in the
#   comment), so a moved or hijacked tag can't change what runs. To update, look up the new
#   tag's commit and replace both.
# - Checkout doesn't leave the workflow token in .git/config (persist-credentials: false):
#   nothing here pushes.
# - The pages job installs no npm packages. scripts/build.mjs uses only Node's built-in
#   modules, so the deploy never runs third-party package code.
# - Plain `pull_request` (not `pull_request_target`): pull requests from forks get a read-only
#   token and no secrets, and can't reach the pages job.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    # Only this job can publish, and only from main.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
